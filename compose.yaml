name: sentricode
services:
  app:
    build: .
    image: sentricode:local
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      SENTRICODE_DATA_DIR: /data
      SENTRICODE_TOKEN: ${SENTRICODE_TOKEN:?Run ./scripts/configure or set an owner token in .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sentricode-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 30s

volumes:
  sentricode-data:
