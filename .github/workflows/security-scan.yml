name: Reusable SentriCode scan
on:
  workflow_call:
    inputs:
      scanner-repository:
        description: Repository holding this scanner (OWNER/sentricode)
        required: true
        type: string
      scanner-ref:
        description: Trusted full commit SHA of the scanner to install
        required: true
        type: string
      fail-on:
        description: Comma-separated severities to block; empty produces reports only
        default: critical,high
        type: string
      upload-sarif:
        description: Enable when the caller repository has GitHub code scanning
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Require a pinned scanner commit
        env:
          SCANNER_REF: ${{ inputs.scanner-ref }}
        run: '[[ "$SCANNER_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - name: Check out the trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.scanner-repository }}
          ref: ${{ inputs.scanner-ref }}
          path: scanner
          persist-credentials: false
      - name: Check out the source as scan data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - name: Check out the pull request base as scan data
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install only the trusted scanner
        run: |
          python -m pip install -r scanner/requirements.lock
          python -m pip install --no-deps ./scanner
      - name: Record the base findings
        if: github.event_name == 'pull_request'
        run: |
          sentricode scan "$GITHUB_WORKSPACE/baseline" --no-project-ignore --format json -o "$RUNNER_TEMP/base-report.json"
          sentricode baseline "$RUNNER_TEMP/base-report.json" -o "$RUNNER_TEMP/baseline.json"
      - name: Scan without installing or running target code
        id: scan
        continue-on-error: true
        env:
          FAIL_ON: ${{ inputs.fail-on }}
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/baseline.json" ]; then
            args+=(--baseline "$RUNNER_TEMP/baseline.json")
          fi
          if [ -n "$FAIL_ON" ]; then
            args+=(--fail-on "$FAIL_ON")
          fi
          sentricode scan "$GITHUB_WORKSPACE/target" --no-project-ignore --format sarif -o "$RUNNER_TEMP/sentricode.sarif" "${args[@]}"
      - name: Preserve the report
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentricode-sarif
          path: ${{ runner.temp }}/sentricode.sarif
          if-no-files-found: warn
          retention-days: 14
      - name: Upload GitHub security alerts
        if: always() && inputs.upload-sarif && steps.scan.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ runner.temp }}/sentricode.sarif
          checkout_path: ${{ github.workspace }}/target
          category: sentricode
      - name: Apply the policy result
        if: always() && steps.scan.outcome == 'failure'
        run: exit 1
